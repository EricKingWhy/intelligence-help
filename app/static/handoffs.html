<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>人工工单 · 喵喵优选</title>
  <link rel="stylesheet" href="/static/acceptance.css">
  <style>
    .queue-tools, .handoff-summary, .handoff-foot { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .queue-tools label, .handoff-foot label { font-weight: 700; }
    select, textarea { font: inherit; color: var(--ink); background: var(--paper); border: 2px solid var(--ink); padding: 6px 8px; }
    textarea { display: block; width: 100%; resize: vertical; margin-top: 6px; }
    #queue-status, .handoff-meta { color: #554854; font-size: .875rem; }
    .handoff { background: var(--paper); border: 2px solid var(--ink); margin-top: 12px; min-width: 0; }
    .handoff summary { padding: 12px; cursor: pointer; }
    .handoff-summary { display: inline-flex; }
    .handoff-body { padding: 4px 16px 16px; border-top: 1px solid var(--ink); overflow-wrap: anywhere; }
    .handoff-body h2 { margin: 14px 0 5px; font-size: 1rem; }
    .handoff-body p, .handoff-body li { line-height: 1.65; white-space: pre-wrap; }
    .handoff-foot { margin-top: 12px; }
    .handoff-foot form { flex: 1 1 100%; }
    .handoff-foot form button { margin-top: 8px; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    @media (max-width: 500px) { .panel { padding: 12px; } .handoff-summary { gap: 7px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <h1>人工工单</h1>
      <span class="spacer"></span>
      <button class="btn" id="refresh" type="button">刷新</button>
    </header>
    <section class="panel" aria-label="工单队列">
      <div class="queue-tools">
        <label for="queue-filter">状态</label>
        <select id="queue-filter">
          <option value="open">待接单与处理中</option>
          <option value="handled">已处理</option>
        </select>
      </div>
      <p id="queue-status" role="status"></p>
      <div id="queue"></div>
      <div class="handoff-foot">
        <button type="button" class="btn sm" id="previous" hidden>上一页</button>
        <button type="button" class="btn sm" id="next" hidden>下一页</button>
      </div>
    </section>
  </main>
  <script src="/static/admin.js"></script>
  <script src="/static/handoffs.js"></script>
</body>
</html>
